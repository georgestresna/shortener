name: release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write        # commit-ul cu tag-ul nou în infra/
  packages: write        # push în GHCR

concurrency:
  group: release         # două release-uri nu rulează niciodată simultan
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: app/api
    env:
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app/api
          push: true
          tags: ghcr.io/georgestresna/shortener-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          tags: ghcr.io/georgestresna/shortener-frontend:${{ github.sha }}

      - name: Scrie tag-ul nou în infra/
        working-directory: infra/apps/shortener/base
        run: |
          kustomize edit set image ghcr.io/georgestresna/shortener-api=ghcr.io/georgestresna/shortener-api:${{ github.sha }}
          kustomize edit set image ghcr.io/georgestresna/shortener-frontend=ghcr.io/georgestresna/shortener-frontend:${{ github.sha }}

      - name: Commit și push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/apps/shortener/base/kustomization.yaml
          git commit -m "deploy shortener ${{ github.sha }}"
          git pull --rebase
          git push