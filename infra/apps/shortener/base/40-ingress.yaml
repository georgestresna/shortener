apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: api-weighted
  namespace: shortener
spec:
  weighted:
    services:
      - name: api-stable
        port: 8000
        weight: 100
      - name: api-canary
        port: 8000
        weight: 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shortener
  namespace: shortener
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api`) || PathPrefix(`/r`)
      kind: Rule
      services:
        - name: api-weighted
          kind: TraefikService
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: frontend
          port: 80