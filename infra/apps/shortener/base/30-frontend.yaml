apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/georgestresna/shortener-frontend:ec4f207fd09112eefde5be3b0008cdb9dae08ac8
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shortener
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80