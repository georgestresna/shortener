apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/georgestresna/shortener-api
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
  strategy:
    canary:
      stableService: api-stable
      canaryService: api-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: api-weighted
      steps:
        - setWeight: 10
        - pause: {}
        - setWeight: 50
        - pause: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shortener
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-stable
  namespace: shortener
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: shortener
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000