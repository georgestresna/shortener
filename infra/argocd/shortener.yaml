apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortener
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/georgestresna/shortener.git
    targetRevision: main
    path: infra/apps/shortener/base
  destination:
    server: https://kubernetes.default.svc
    namespace: shortener
  ignoreDifferences:               # NOU: ArgoCD nu se atinge de ponderile 90/10
    - group: traefik.io
      kind: TraefikService
      jsonPointers:
        - /spec/weighted/services
  syncPolicy:
    automated:
      prune: true                # sterge din cluster ce dispare din Git
      selfHeal: true             # anulează modificările manuale
    syncOptions:                   # NOU: respectă regula de mai sus și la sincronizare
      - RespectIgnoreDifferences=true